[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"signflow/settings.py" = ["E501"]
"esign/tests.py" = ["S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "signflow.settings"
python_files = ["tests.py", "test_*.py"]
